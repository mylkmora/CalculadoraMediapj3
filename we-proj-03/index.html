<!DOCTYPE html>
 <html lang="pt-BR">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Calculadora de Média</title>
     <link rel="stylesheet" href="estilo.css">
 </head>
 <body>
     <div class="caixa">
         <h1>Calculadora de Média</h1>
         <input type="number" id="nota1" placeholder="Nota 1" step="0.1" min="0" max="10">
         <input type="number" id="nota2" placeholder="Nota 2" step="0.1" min="0" max="10">
         <input type="number" id="nota3" placeholder="Nota 3" step="0.1" min="0" max="10">
         <button id="botaoCalcular">Calcular</button>
         <div id="media"></div>
         <div id="status"></div>
     </div>
     <script src="script.js"></script>
 </body>
 </html>
